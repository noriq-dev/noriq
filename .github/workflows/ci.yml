# PLNR-22 / PLNR-559: quality gate for contributors. Typecheck, authz/wrangler/hook
# guards, and the test suite on every PR (and pushes to main). No secrets, no deploy —
# Noriq is self-hosted, so each operator runs their own `wrangler deploy`. This only
# stops regressions from merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Authorization boundaries
        run: npm run check:authz

      - name: Wrangler configs
        run: npm run check:wrangler

      - name: deleteProject cascade
        run: npm run check:delete-project

      - name: Claude Code hooks
        run: npm run test:hooks

      # @noriq-dev/shared is consumed as source (no build output), so nothing to
      # build here — typecheck resolves it straight from packages/shared/src.
      - name: Typecheck
        run: npm run typecheck

      # apps/api's vitest runs on the workerd pool (real Durable Objects + D1 migrations).
      - name: Test
        run: npm run test
