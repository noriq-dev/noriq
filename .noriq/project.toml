key = "PLNR"
repositoryKey = "noriq"
defaultBranch = "main"

[sourceControl]
backend = "auto"
mode = "isolated"
base = "main"
target = "main"
landing = "manual"

[harness]
maxParallelTasks = 2
maxRepairRounds = 2
maxJobMinutes = 240

[agents.guide]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

[agents.builder]
driver = "claude"
model = "sonnet"
effort = "medium"

[agents.reviewer]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

[setup]
commands = ["npm ci"]
timeoutSeconds = 900

[checks]
commands = ["npm run typecheck", "npm test"]
timeoutSeconds = 900
